name: captcha_view
description: >-
  A customizable Flutter package providing text captchas with distorted characters
  and slide-to-verify puzzle captchas.
version: 0.2.0
homepage: https://github.com/oliverchu/captcha_view
repository: https://github.com/oliverchu/captcha_view
issue_tracker: https://github.com/oliverchu/captcha_view/issues

screenshots:
  - description: CaptchaView text captcha and SlideVerifyView puzzle slider.
    path: screenshot/Screenshot_1611307510.png

topics:
  - captcha
  - verification
  - security
  - puzzle
  - widget

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/3.0x/ic_puzzle.png
    - assets/images/3.0x/ic_verify_bg.jpeg
